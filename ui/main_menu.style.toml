# Main Menu styles — tokens from ui/theme.toml, shared with the race HUD.
# menu.rhai sets the logo rect and the version line's y each frame; the
# procedural screens read the same tokens through kit::theme().
#
# All elements use layer >= 1 so they draw above the background speed
# lines (layer 0).
tokens = "ui/theme.toml"

[styles.screen-container]
width_pct = 100
height_pct = 100
bg_color = [0.0, 0.0, 0.0, 0.0]

[styles.title-logo]
width = 300
height = 200
color = [1.0, 1.0, 1.0, 1.0]
layer = 3

[styles.version]
font = "$font.label"
font_size = "$type.sm"
color = "$color.cream"
text_align = "center"
width_pct = 100
layer = 3
