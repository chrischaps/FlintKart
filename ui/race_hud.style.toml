# Race HUD styles — text with black stroke outlines, no panel backgrounds
# Panels use horizontal layout so labels and values share independent y positions

[styles.hud-panel-lap]
x = 10
y = 10
width = 200
height = 50
layout = "horizontal"

[styles.lap-label]
x = 10
y = 14
font_size = 22
color = [0.7, 0.7, 0.7, 1.0]
stroke_color = [0.0, 0.0, 0.0, 0.8]
stroke_width = 2

[styles.lap-value]
x = 60
y = 11
font_size = 28
color = [1.0, 1.0, 1.0, 1.0]
stroke_color = [0.0, 0.0, 0.0, 0.8]
stroke_width = 2

[styles.hud-panel-timer]
x = -10
y = 10
width = 230
height = 50
layout = "horizontal"

[styles.timer-label]
x = 10
y = 14
font_size = 22
color = [0.7, 0.7, 0.7, 1.0]
stroke_color = [0.0, 0.0, 0.0, 0.8]
stroke_width = 2

[styles.timer-value]
x = 70
y = 11
font_size = 28
color = [1.0, 1.0, 1.0, 1.0]
stroke_color = [0.0, 0.0, 0.0, 0.8]
stroke_width = 2

[styles.hud-panel-best]
x = -10
y = 65
width = 230
height = 30
layout = "horizontal"

[styles.best-label]
x = 10
y = 6
font_size = 18
color = [0.5, 0.8, 0.5, 1.0]
stroke_color = [0.0, 0.0, 0.0, 0.8]
stroke_width = 2

[styles.best-value]
