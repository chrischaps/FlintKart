[ui]
name = "Race HUD"
style = "ui/race_hud.style.toml"

# The race HUD, pause menu and results podium are drawn by scripts/hud.rhai
# on scripts/lib/kit.rhai: their positions follow the screen size and their
# motion follows race state, so they are procedural. This document's job is
# to bring ui/theme.toml into the UI system (through its style's `tokens`),
# which is where kit::theme() reads every colour, font, size and timing.
#
# Its one element is an empty full-screen panel that draws nothing.

[elements.hud_root]
type = "panel"
anchor = "top-left"
class = "hud-root"
