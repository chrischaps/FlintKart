[ui]
name = "Main Menu"
style = "ui/main_menu.style.toml"

# Title screen: its static parts. menu.rhai sizes and bobs the logo each
# frame. The track-select cards and the paint select are procedural
# (scripts/menu.rhai on scripts/lib/kit.rhai), because their count comes
# from ui/tracks.toml and ui/paints.toml and their motion from input.

[elements.title_screen]
type = "panel"
anchor = "top-left"
class = "screen-container"

[elements.title_logo]
type = "image"
parent = "title_screen"
class = "title-logo"
src = "logo.png"

[elements.version]
type = "text"
parent = "title_screen"
class = "version"
text = "Built on the Flint engine"
