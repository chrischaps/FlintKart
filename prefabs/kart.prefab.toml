# ================================================================
#  Kart Prefab — complete kart entity group (14 entities)
# ================================================================
#
#  Instantiated per-racer with prefix substitution.
#  Entity names are suffixes — expanded to {prefix}_{name}.
#  String values containing ${PREFIX} are substituted at load time.
#
#  Example: prefix = "player" produces:
#    player_kart, player_wheel_fl, player_visuals, etc.

[prefab]
name = "kart"
description = "Complete racing kart with body, wheels, driver, lights, visuals, and audio"


# ── Body (root entity for the kart hierarchy) ──

[entities.kart]

[entities.kart.transform]
position = [0, 0, 0]
rotation = [0, 0, 0]

[entities.kart.model]
asset = "kart_body"

[entities.kart.kart_physics]
max_speed = 30.0
acceleration = 15.0
brake_decel = 25.0
drag = 0.5
turn_rate_low = 180.0
turn_rate_high = 60.0
gravity = -20.0
ground_ray_length = 2.0

[entities.kart.kart_state]
speed = 0.0
velocity_x = 0.0
velocity_y = 0.0
velocity_z = 0.0
forward_x = 0.0
forward_y = 0.0
forward_z = -1.0
grounded = false
surface_normal_x = 0.0
surface_normal_y = 1.0
surface_normal_z = 0.0
yaw = 0.0
input_enabled = false

[entities.kart.kart_visual_state]
steering = 0.0
braking = false
reversing = false
wheel_spin = 0.0
throttle = 0.0

[entities.kart.race_progress]
spline_t = 0.0
prev_spline_t = 0.0
current_lap = 0
total_laps = 3
lap_time = 0.0
best_lap = 999.0
race_time = 0.0
passed_start = false

[entities.kart.race_position]
position = 1
total_racers = 6

[entities.kart.racer_info]
name = "Racer"
color_r = 0.9
color_g = 0.9
color_b = 0.9

[entities.kart.item_holder]
held_item = "none"
shield_active = false
shield_timer = 0.0
item_boost_active = false
item_boost_timer = 0.0
spinout_active = false
spinout_timer = 0.0
spinout_yaw_speed = 0.0
collect_cooldown = 0.0

[entities.kart.drift_state]
state = "none"
drift_angle = 0.0
drift_direction = 0.0
drift_timer = 0.0
boost_tier = 0
boost_time_remaining = 0.0
boost_speed_bonus = 0.0
hop_timer = 0.0

[entities.kart.script]
source = "kart_controller.rhai"


# ── Wheels (children of kart) ──

[entities.wheel_fl]
parent = "kart"
[entities.wheel_fl.transform]
position = [-0.73, 0.1, -1.0]
[entities.wheel_fl.model]
asset = "kart_wheel"

[entities.wheel_fr]
parent = "kart"
[entities.wheel_fr.transform]
position = [0.73, 0.1, -1.0]
[entities.wheel_fr.model]
asset = "kart_wheel"

[entities.wheel_rl]
parent = "kart"
[entities.wheel_rl.transform]
position = [-0.73, 0.1, 0.85]
[entities.wheel_rl.model]
asset = "kart_wheel"

[entities.wheel_rr]
parent = "kart"
[entities.wheel_rr.transform]
position = [0.73, 0.1, 0.85]
[entities.wheel_rr.model]
asset = "kart_wheel"


# ── Driver (child of kart) ──

[entities.driver]
parent = "kart"
[entities.driver.transform]
position = [0.0, 0.32, 0.15]
[entities.driver.model]
asset = "kart_driver"


# ── Tail lights (children of kart) ──

[entities.light_l]
parent = "kart"
[entities.light_l.transform]
position = [-0.35, 0.22, 1.28]
[entities.light_l.model]
asset = "kart_light"

[entities.light_r]
parent = "kart"
[entities.light_r.transform]
position = [0.35, 0.22, 1.28]
[entities.light_r.model]
asset = "kart_light"


# ── Visuals controller (animates wheels, lights, particles) ──

[entities.visuals]
[entities.visuals.transform]
position = [0, 0, 0]
[entities.visuals.kart_visuals_config]
kart = "${PREFIX}_kart"
prefix = "${PREFIX}"
[entities.visuals.script]
source = "kart_visuals.rhai"


# ── Audio controller ──

[entities.audio_ctrl]
[entities.audio_ctrl.transform]
position = [0, 0, 0]
[entities.audio_ctrl.kart_audio_config]
kart = "${PREFIX}_kart"
prefix = "${PREFIX}"
[entities.audio_ctrl.script]
source = "engine_audio.rhai"


# ── Engine sound layers (spatial, looping, parented to kart) ──

[entities.engine_idle]
parent = "kart"
[entities.engine_idle.transform]
position = [0, 0.3, 0]
[entities.engine_idle.audio_source]
file = "audio/engine_idle.ogg"
spatial = true
loop = true
autoplay = true
volume = 0.6
pitch = 1.0
min_distance = 2.0
max_distance = 40.0

[entities.engine_mid]
parent = "kart"
[entities.engine_mid.transform]
position = [0, 0.3, 0]
[entities.engine_mid.audio_source]
file = "audio/engine_mid.ogg"
spatial = true
loop = true
autoplay = true
volume = 0.0
pitch = 1.0
min_distance = 2.0
max_distance = 40.0

[entities.engine_high]
parent = "kart"
[entities.engine_high.transform]
position = [0, 0.3, 0]
[entities.engine_high.audio_source]
file = "audio/engine_high.ogg"
spatial = true
loop = true
autoplay = true
volume = 0.0
pitch = 1.0
min_distance = 2.0
max_distance = 40.0
