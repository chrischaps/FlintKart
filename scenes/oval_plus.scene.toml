# ================================================================
#  FLINT KART — Phase 1: Oval Plus
# ================================================================
#
#  One kart, one track, three laps.
#  The core racing loop proving the Flint engine can handle
#  something beyond first-person shooters.
#
#  Launch: play.bat
#
#  Controls:
#    W / Up     - Accelerate
#    S / Down   - Brake
#    A / Left   - Steer left
#    D / Right  - Steer right
#    L.Shift    - Drift (hold while steering at speed)
#    R          - Restart race
#    Escape     - Exit
#    F1         - Debug modes
# ================================================================

[scene]
name = "Flint Kart — Oval Plus"
version = "1.0"
description = "Phase 1: single kart racing prototype on the Oval Plus track"
input_config = "config/input.toml"

[environment]
skybox = "textures/skybox_kart.png"


# ============================================================
#  KART — the vehicle the player controls
# ============================================================

[entities.kart]

[entities.kart.transform]
position = [-1.5, 1.0, 5]
rotation = [0, 0, 0]

[entities.kart.model]
asset = "kart_body"

[entities.kart.kart_physics]
max_speed = 30.0
acceleration = 15.0
brake_decel = 25.0
drag = 0.5
turn_rate_low = 180.0
turn_rate_high = 60.0
gravity = -20.0
ground_ray_length = 2.0

[entities.kart.kart_state]
speed = 0.0
velocity_x = 0.0
velocity_y = 0.0
velocity_z = 0.0
forward_x = 0.0
forward_y = 0.0
forward_z = -1.0
grounded = false
surface_normal_x = 0.0
surface_normal_y = 1.0
surface_normal_z = 0.0
yaw = 0.0
input_enabled = false

[entities.kart.kart_visual_state]
steering = 0.0
braking = false
reversing = false
wheel_spin = 0.0
throttle = 0.0

[entities.kart.race_progress]
spline_t = 0.0
prev_spline_t = 0.0
current_lap = 0
total_laps = 3
lap_time = 0.0
best_lap = 999.0
race_time = 0.0
