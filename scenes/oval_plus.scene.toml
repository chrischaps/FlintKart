color_start = [1.0, 0.9, 0.4, 1.0]
color_end = [1.0, 0.3, 0.0, 0.0]
blend_mode = "additive"
shape = "point"
world_space = true
autoplay = false
playing = false
looping = true

# Boost trail — dormant until boost mechanic is added
[entities.fx_boost]
[entities.fx_boost.transform]
position = [0, 0.45, 1.1]
[entities.fx_boost.particle_emitter]
emission_rate = 0.0
max_particles = 200
lifetime_min = 0.2
lifetime_max = 0.6
speed_min = 0.2
speed_max = 1.0
direction = [0, 0, 0]
spread = 180.0
gravity = [0, 0, 0]
damping = 2.0
size_start = 0.15
size_end = 0.02
color_start = [0.3, 0.6, 1.0, 0.8]
color_end = [0.1, 0.2, 1.0, 0.0]
blend_mode = "additive"
shape = "sphere"
shape_radius = 0.2
world_space = true
autoplay = false
playing = false
looping = true


# ============================================================
#  CHASE CAMERA — follows the kart from behind
# ============================================================

[entities.chase_camera]

[entities.chase_camera.transform]
position = [0, 5, 10]

[entities.chase_camera.script]
source = "chase_camera.rhai"


# ============================================================
#  RACE MANAGER — state machine + lap tracking + HUD
# ============================================================

[entities.race_manager]

[entities.race_manager.transform]
position = [0, 0, 0]

[entities.race_manager.race_state]
state = "countdown"
countdown_timer = 4.0
countdown_display = ""

[entities.race_manager.script]
source = "race_manager.rhai"


# ============================================================
#  HUD — renders all 2D overlay elements
# ============================================================

[entities.hud]

[entities.hud.transform]
position = [0, 0, 0]

[entities.hud.script]
source = "hud.rhai"


# ============================================================
#  TRACK — spline path + swept cross-section meshes
# ============================================================

# Pure path data — no geometry
[entities.track_path]
[entities.track_path.spline]
file = "splines/oval_plus.spline.toml"

# Road surface — wide, thin slab centered on the spline
[entities.track_road]
[entities.track_road.spline_mesh]
spline = "track_path"
width = 12.0
height = 0.3
offset = [0.0, -0.15]
color = [0.25, 0.25, 0.28, 1.0]
friction = 0.8
restitution = 0.1

# Left wall — narrow, tall box at left edge
[entities.track_wall_left]
[entities.track_wall_left.spline_mesh]
spline = "track_path"
width = 0.5
height = 1.5
offset = [-6.25, 0.75]
color = [0.7, 0.15, 0.15, 1.0]
friction = 0.3
restitution = 0.5

# Right wall — narrow, tall box at right edge
[entities.track_wall_right]
[entities.track_wall_right.spline_mesh]
spline = "track_path"
width = 0.5
height = 1.5
offset = [6.25, 0.75]
color = [0.15, 0.15, 0.7, 1.0]
friction = 0.3
restitution = 0.5


# ============================================================
#  SUN — directional light
# ============================================================

[entities.sun]

[entities.sun.transform]
position = [0, 50, 0]
rotation = [-45, 30, 0]

[entities.sun.light]
type = "directional"
direction = [-0.35, 0.71, 0.61]
color = [1.0, 1.0, 0.98]
intensity = 1.0
