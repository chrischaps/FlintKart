# ================================================================
#  FLINT KART — Phase 1: Oval Plus
# ================================================================
#
#  One kart, one track, three laps.
#  The core racing loop proving the Flint engine can handle
#  something beyond first-person shooters.
#
#  Launch: play.bat
#
#  Controls:
#    W / Up     - Accelerate
#    S / Down   - Brake
#    A / Left   - Steer left
#    D / Right  - Steer right
#    L.Shift    - Drift (hold while steering at speed)
#    R          - Restart race
#    Escape     - Exit
#    F1         - Debug modes
# ================================================================

[scene]
name = "Flint Kart — Oval Plus"
version = "1.0"
description = "Phase 1: single kart racing prototype on the Oval Plus track"
input_config = "config/input.toml"

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 0.9
vignette_enabled = true
vignette_intensity = 0.35
vignette_smoothness = 0.9
# A one-step ordered dither: no 8-bit banding in the sky's long gradients
dither_enabled = true
dither_intensity = 0.005
exposure = 1.1
ssao_enabled = true
ssao_radius = 0.8
ssao_intensity = 0.7
# Sunday-morning air: clear near, a soft blue haze toward the ring of hills
fog_enabled = true
fog_color = [0.56, 0.72, 0.92]
fog_density = 0.0013
fog_start = 70.0
fog_height_enabled = true
fog_height_falloff = 0.02
fog_height_origin = 0.0

# Sky — crisp late-morning blue with fair-weather clouds (replaces the
# painted skybox; the sun disc follows the sun light below)
[entities.sky]
[entities.sky.sky]
zenith_color = [0.04, 0.20, 0.66, 1.0]
horizon_color = [0.34, 0.58, 0.90, 1.0]
haze_color = [0.89, 0.93, 0.95, 0.4]
cloud_tint = [1.0, 0.99, 0.96, 0.9]
cloud_coverage = 0.38
cloud_density = 0.3
cloud_scale = 0.8
sun_disc_size = 0.03
sun_glow = 0.8


