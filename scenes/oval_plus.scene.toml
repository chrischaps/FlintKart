# Road surface — wide, thin slab centered on the spline. Asphalt with
# tomato/cream curbs, cream edge lines and a dashed sun centre line, one
# repeat every 12 m (tools/generate_road_textures.py)
[entities.track_road]
[entities.track_road.spline_mesh]
spline = "track_path"
width = 12.0
height = 0.3
offset = [0.0, -0.15]
