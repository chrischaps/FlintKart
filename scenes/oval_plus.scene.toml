# ================================================================
#  FLINT KART — Phase 1: Oval Plus
# ================================================================
#
#  One kart, one track, three laps.
#  The core racing loop proving the Flint engine can handle
#  something beyond first-person shooters.
#
#  Launch: play.bat
#
#  Controls:
#    W / Up     - Accelerate
#    S / Down   - Brake
#    A / Left   - Steer left
#    D / Right  - Steer right
#    R          - Restart race
#    Escape     - Exit
#    F1         - Debug modes
# ================================================================

[scene]
name = "Flint Kart — Oval Plus"
version = "1.0"
description = "Phase 1: single kart racing prototype on the Oval Plus track"
input_config = "config/input.toml"

[environment]
skybox = "textures/skybox_kart.png"


# ============================================================
#  KART — the vehicle the player controls
# ============================================================

[entities.kart]

[entities.kart.transform]
position = [0, 1.0, 5]
rotation = [0, 0, 0]

[entities.kart.model]
asset = "kart_body"

[entities.kart.rigidbody]
body_type = "kinematic"
mass = 800.0
gravity_scale = 0.0

[entities.kart.collider]
shape = "box"
size = [1.8, 1.0, 3.0]

[entities.kart.kart_physics]
max_speed = 30.0
acceleration = 15.0
brake_decel = 25.0
drag = 0.5
turn_rate_low = 180.0
turn_rate_high = 60.0
gravity = -20.0
ground_ray_length = 2.0

[entities.kart.kart_state]
speed = 0.0
velocity_x = 0.0
velocity_y = 0.0
velocity_z = 0.0
forward_x = 0.0
forward_y = 0.0
forward_z = -1.0
grounded = false
surface_normal_x = 0.0
surface_normal_y = 1.0
surface_normal_z = 0.0
yaw = 0.0
input_enabled = false

[entities.kart.kart_visual_state]
steering = 0.0
braking = false
reversing = false
wheel_spin = 0.0
throttle = 0.0

[entities.kart.race_progress]
spline_t = 0.0
prev_spline_t = 0.0
current_lap = 0
total_laps = 3
lap_time = 0.0
best_lap = 999.0
race_time = 0.0
passed_start = false

[entities.kart.script]
source = "kart_controller.rhai"


# ── Kart child entities (positioned relative to kart via hierarchy) ──

[entities.kart_wheel_fl]
parent = "kart"
[entities.kart_wheel_fl.transform]
position = [-0.70, 0.22, -1.0]
[entities.kart_wheel_fl.model]
asset = "kart_wheel"

[entities.kart_wheel_fr]
parent = "kart"
[entities.kart_wheel_fr.transform]
position = [0.70, 0.22, -1.0]
[entities.kart_wheel_fr.model]
asset = "kart_wheel"

[entities.kart_wheel_rl]
parent = "kart"
[entities.kart_wheel_rl.transform]
position = [-0.70, 0.22, 0.85]
[entities.kart_wheel_rl.model]
asset = "kart_wheel"

[entities.kart_wheel_rr]
parent = "kart"
[entities.kart_wheel_rr.transform]
position = [0.70, 0.22, 0.85]
[entities.kart_wheel_rr.model]
asset = "kart_wheel"

[entities.kart_driver]
parent = "kart"
[entities.kart_driver.transform]
position = [0.0, 0.12, 0.15]
[entities.kart_driver.model]
asset = "kart_driver"

[entities.kart_light_l]
parent = "kart"
[entities.kart_light_l.transform]
position = [-0.35, 0.22, 1.28]
[entities.kart_light_l.model]
asset = "kart_light"

[entities.kart_light_r]
parent = "kart"
[entities.kart_light_r.transform]
position = [0.35, 0.22, 1.28]
[entities.kart_light_r.model]
asset = "kart_light"


# ============================================================
#  KART VISUALS — animates wheels, lights, etc.
# ============================================================

[entities.kart_visuals]

[entities.kart_visuals.transform]
position = [0, 0, 0]

[entities.kart_visuals.script]
source = "kart_visuals.rhai"


# ============================================================
#  PARTICLE EFFECTS — standalone emitters driven by kart_visuals
# ============================================================
#  These are NOT parented to "kart" — the particle system reads
#  raw transform.position as world-space spawn origin.
#  kart_visuals.rhai repositions them each frame.

# Exhaust smoke — warm gray puffs trailing behind the kart
[entities.fx_exhaust]
[entities.fx_exhaust.transform]
position = [0, 0.30, 1.5]
[entities.fx_exhaust.particle_emitter]
emission_rate = 0.0
max_particles = 120
lifetime_min = 0.6
lifetime_max = 1.4
speed_min = 0.3
speed_max = 0.8
direction = [0, 1, 0]
spread = 25.0
gravity = [0, 0.3, 0]
damping = 1.2
size_start = 0.06
size_end = 0.25
color_start = [0.55, 0.52, 0.50, 0.25]
color_end = [0.65, 0.63, 0.60, 0.0]
blend_mode = "alpha"
shape = "point"
world_space = true
autoplay = false
playing = false
looping = true

# Tire dust — left rear wheel ground contact
[entities.fx_dust_rl]
[entities.fx_dust_rl.transform]
position = [-0.70, 0.05, 0.85]
[entities.fx_dust_rl.particle_emitter]
emission_rate = 0.0
max_particles = 80
lifetime_min = 0.4
lifetime_max = 1.0
speed_min = 0.5
speed_max = 1.5
direction = [0, 1, 0]
spread = 40.0
gravity = [0, -2.0, 0]
damping = 1.5
size_start = 0.08
size_end = 0.20
color_start = [0.65, 0.55, 0.40, 0.35]
color_end = [0.70, 0.65, 0.55, 0.0]
blend_mode = "alpha"
shape = "box"
shape_extents = [0.15, 0.02, 0.05]
world_space = true
autoplay = false
playing = false
looping = true

# Tire dust — right rear wheel ground contact
[entities.fx_dust_rr]
[entities.fx_dust_rr.transform]
position = [0.70, 0.05, 0.85]
[entities.fx_dust_rr.particle_emitter]
emission_rate = 0.0
max_particles = 80
lifetime_min = 0.4
lifetime_max = 1.0
speed_min = 0.5
speed_max = 1.5
direction = [0, 1, 0]
spread = 40.0
gravity = [0, -2.0, 0]
damping = 1.5
size_start = 0.08
size_end = 0.20
color_start = [0.65, 0.55, 0.40, 0.35]
color_end = [0.70, 0.65, 0.55, 0.0]
blend_mode = "alpha"
shape = "box"
shape_extents = [0.15, 0.02, 0.05]
world_space = true
autoplay = false
playing = false
looping = true

# Brake sparks — staccato white-hot to orange pinpoints
[entities.fx_sparks]
[entities.fx_sparks.transform]
position = [0, 0.10, 1.3]
[entities.fx_sparks.particle_emitter]
emission_rate = 0.0
max_particles = 100
lifetime_min = 0.15
lifetime_max = 0.45
speed_min = 3.0
speed_max = 7.0
direction = [0, 0.3, 0]
spread = 60.0
gravity = [0, -12.0, 0]
damping = 0.2
size_start = 0.025
