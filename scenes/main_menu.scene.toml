# ================================================================
#  FLINT KART — Main Menu
# ================================================================
#
#  Title screen and track selection. Lightweight scene with a
#  display kart, ambient music, and the menu controller script.
#
#  Launch: play.bat
# ================================================================

[scene]
name = "Flint Kart — Main Menu"
version = "1.0"
description = "Title screen and track selection menu"
input_config = "config/input.toml"

[post_process]
bloom_enabled = true
bloom_intensity = 0.12
bloom_threshold = 0.85
vignette_enabled = true
vignette_intensity = 0.5
vignette_smoothness = 0.9
# A one-step ordered dither: no 8-bit banding in the sky's long gradients
dither_enabled = true
dither_intensity = 0.005
exposure = 1.15
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 1.3
# The Oval Plus infield on a Sunday morning: the same air as the race
fog_enabled = true
fog_color = [0.56, 0.72, 0.92]
fog_density = 0.0013
fog_start = 70.0
fog_height_enabled = true
fog_height_falloff = 0.02
fog_height_origin = 0.0

# Sky: Oval Plus's own, so the title screen is the place you're about to
# race. The haze meets the fog colour at the horizon; the sun disc follows
# the sun light below. The ground is the menu stage at the end of the file.
[entities.sky]
[entities.sky.sky]
zenith_color = [0.04, 0.20, 0.66, 1.0]
horizon_color = [0.34, 0.58, 0.90, 1.0]
haze_color = [0.89, 0.93, 0.95, 0.4]
cloud_tint = [1.0, 0.99, 0.96, 0.9]
cloud_coverage = 0.38
cloud_density = 0.3
cloud_scale = 0.8
sun_disc_size = 0.03
sun_glow = 0.8


# ============================================================
#  DISPLAY KART — decorative kart for the title screen
# ============================================================

[prefabs.display]
template = "kart"
prefix = "display"
[prefabs.display.overrides.kart.transform]
# Tyres on the lawn (0.07 m here) for the first frame and for `flint render`;
# menu.rhai then sets every tyre on the ground from scripts/lib/menu_ground.rhai
position = [0, 0.24, 0]
rotation = [0, -30, 0]
[prefabs.display.overrides.kart.kart_state]
input_enabled = false
# Disable gameplay scripts — menu.rhai handles all animation
[prefabs.display.overrides.kart.script]
source = ""
[prefabs.display.overrides.visuals.script]
source = ""
[prefabs.display.overrides.audio_ctrl.script]
source = ""
# Silence engine audio (menu has its own music)
[prefabs.display.overrides.engine_idle.audio_source]
autoplay = false
volume = 0.0
[prefabs.display.overrides.engine_mid.audio_source]
autoplay = false
volume = 0.0
[prefabs.display.overrides.engine_high.audio_source]
autoplay = false
volume = 0.0


