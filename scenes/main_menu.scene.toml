# ================================================================
#  FLINT KART — Main Menu
# ================================================================
#
#  Title screen and track selection. Lightweight scene with a
#  display kart, ambient music, and the menu controller script.
#
#  Launch: play.bat
# ================================================================

[scene]
name = "Flint Kart — Main Menu"
version = "1.0"
description = "Title screen and track selection menu"
input_config = "config/input.toml"

[environment]
skybox = "textures/skybox_kart.png"

[post_process]
bloom_enabled = true
bloom_intensity = 0.12
bloom_threshold = 0.85
vignette_enabled = true
vignette_intensity = 0.5
vignette_smoothness = 0.9
exposure = 1.15
ssao_enabled = true
ssao_radius = 0.6
ssao_intensity = 1.3
fog_enabled = true
fog_color = [0.55, 0.60, 0.75]
fog_density = 0.004
fog_start = 15.0
fog_height_enabled = false


# ============================================================
#  DISPLAY KART — decorative kart for the title screen
# ============================================================

[prefabs.display]
template = "kart"
prefix = "display"
[prefabs.display.overrides.kart.transform]
position = [0, 0.5, 0]
rotation = [0, -30, 0]
[prefabs.display.overrides.kart.kart_state]
input_enabled = false
# Disable gameplay scripts — menu.rhai handles all animation
[prefabs.display.overrides.kart.script]
source = ""
[prefabs.display.overrides.visuals.script]
source = ""
[prefabs.display.overrides.audio_ctrl.script]
source = ""
# Silence engine audio (menu has its own music)
[prefabs.display.overrides.engine_idle.audio_source]
autoplay = false
volume = 0.0
[prefabs.display.overrides.engine_mid.audio_source]
autoplay = false
volume = 0.0
[prefabs.display.overrides.engine_high.audio_source]
autoplay = false
volume = 0.0


# ============================================================
#  DRIFT PARTICLE EFFECTS — tire dust + sparks for the donut
# ============================================================

# Tire dust — left rear wheel
[entities.display_dust_l]
[entities.display_dust_l.transform]
position = [0, 0, 0]
[entities.display_dust_l.particle_emitter]
emission_rate = 0.0
max_particles = 80
lifetime_min = 0.5
lifetime_max = 1.2
speed_min = 0.4
speed_max = 1.2
direction = [0, 1, 0]
spread = 45.0
gravity = [0, -1.5, 0]
damping = 1.2
size_start = 0.10
size_end = 0.30
color_start = [0.65, 0.55, 0.40, 0.30]
color_end = [0.70, 0.65, 0.55, 0.0]
blend_mode = "alpha"
shape = "box"
shape_extents = [0.15, 0.02, 0.08]
world_space = true
autoplay = false
playing = false
looping = true

# Tire dust — right rear wheel
[entities.display_dust_r]
[entities.display_dust_r.transform]
position = [0, 0, 0]
[entities.display_dust_r.particle_emitter]
emission_rate = 0.0
max_particles = 80
lifetime_min = 0.5
lifetime_max = 1.2
speed_min = 0.4
speed_max = 1.2
direction = [0, 1, 0]
spread = 45.0
gravity = [0, -1.5, 0]
damping = 1.2
size_start = 0.10
size_end = 0.30
color_start = [0.65, 0.55, 0.40, 0.30]
color_end = [0.70, 0.65, 0.55, 0.0]
blend_mode = "alpha"
shape = "box"
shape_extents = [0.15, 0.02, 0.08]
world_space = true
autoplay = false
playing = false
looping = true

# Drift sparks — left rear wheel (golden)
[entities.display_sparks_l]
[entities.display_sparks_l.transform]
position = [0, 0, 0]
[entities.display_sparks_l.particle_emitter]
emission_rate = 0.0
max_particles = 100
lifetime_min = 0.12
lifetime_max = 0.4
speed_min = 2.5
speed_max = 6.0
direction = [0, 0.5, 0]
spread = 50.0
gravity = [0, -10.0, 0]
damping = 0.3
size_start = 0.025
size_end = 0.008
color_start = [1.0, 0.85, 0.3, 1.0]
color_end = [1.0, 0.4, 0.1, 0.0]
blend_mode = "additive"
shape = "point"
world_space = true
autoplay = false
playing = false
looping = true

# Drift sparks — right rear wheel (golden)
[entities.display_sparks_r]
[entities.display_sparks_r.transform]
position = [0, 0, 0]
[entities.display_sparks_r.particle_emitter]
emission_rate = 0.0
max_particles = 100
lifetime_min = 0.12
lifetime_max = 0.4
speed_min = 2.5
speed_max = 6.0
direction = [0, 0.5, 0]
spread = 50.0
gravity = [0, -10.0, 0]
