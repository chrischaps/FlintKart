color_start = [0.65, 0.55, 0.40, 0.30]
color_end = [0.70, 0.65, 0.55, 0.0]
blend_mode = "alpha"
shape = "box"
shape_extents = [0.15, 0.02, 0.08]
world_space = true
autoplay = false
