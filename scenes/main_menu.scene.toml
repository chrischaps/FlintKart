# ============================================================
#  LIGHTING
# ============================================================

[entities.sun]
[entities.sun.transform]
position = [0, 50, 0]
rotation = [-45, 30, 0]
[entities.sun.light]
type = "directional"
direction = [-0.35, 0.71, 0.61]
color = [1.0, 1.0, 0.98]
intensity = 1.0


# ============================================================
#  MENU MUSIC — relaxed version of race theme
# ============================================================

[entities.snd_menu_music]
[entities.snd_menu_music.transform]
position = [0, 0, 0]
[entities.snd_menu_music.audio_source]
file = "audio/race_music.ogg"
spatial = false
loop = true
autoplay = true
volume = 0.25
pitch = 0.9


# ============================================================
#  TIRE SKID AMBIENT — subtle continuous drift squeal
# ============================================================

[entities.snd_tire_skid]
[entities.snd_tire_skid.transform]
position = [0, 0, 0]
[entities.snd_tire_skid.audio_source]
file = "audio/tire_skid.ogg"
spatial = false
loop = true
autoplay = true
volume = 0.06
pitch = 0.85


# ============================================================
#  MENU CONTROLLER — drives the menu UI + camera orbit
# ============================================================

[entities.menu_controller]
[entities.menu_controller.transform]
position = [0, 0, 0]
[entities.menu_controller.script]
source = "menu.rhai"
