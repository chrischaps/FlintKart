# ================================================================
#  FLINT KART — The Crossroads
# ================================================================
#
#  Auto-generated by build_branching_track.py
#  Source: tracks/the_crossroads.track.toml
#
#  Controls:
#    W / Up     - Accelerate
#    S / Down   - Brake
#    A / Left   - Steer left
#    D / Right  - Steer right
#    L.Shift    - Drift
#    R          - Restart race
#    Escape     - Exit
#    F1         - Debug modes
# ================================================================

[scene]
name = "Flint Kart — The Crossroads"
version = "1.0"
description = "Branching track: The Crossroads"
input_config = "config/input.toml"

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 0.9
vignette_enabled = true
vignette_intensity = 0.4
vignette_smoothness = 0.9
# A one-step ordered dither: no 8-bit banding in the sky's long gradients
