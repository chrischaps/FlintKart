# ================================================================
#  FLINT KART — Mountain Switchback
# ================================================================
#
#  Alpine switchback track with hairpin turns, steep climbs, and
#  a dramatic summit at 29m elevation. Narrow roads, stone walls,
#  cold mountain atmosphere.
#
#  Launch: play_mountain.bat
#
#  Controls:
#    W / Up     - Accelerate
#    S / Down   - Brake
#    A / Left   - Steer left
#    D / Right  - Steer right
#    L.Shift    - Drift (hold while steering at speed)
#    R          - Restart race
#    Escape     - Exit
#    F1         - Debug modes
# ================================================================

[scene]
name = "Flint Kart — Mountain Switchback (Chris)"
version = "1.0"
description = "Alpine switchback track with hairpins, elevation, and a summit"
input_config = "config/input.toml"

[environment]
skybox = "textures/skybox_mountain.png"

[post_process]
bloom_enabled = true
bloom_intensity = 0.08
bloom_threshold = 0.85
vignette_enabled = true
vignette_intensity = 0.40
vignette_smoothness = 0.9
exposure = 1.05
ssao_enabled = true
ssao_radius = 1.0
ssao_intensity = 0.9
fog_enabled = true
fog_color = [0.75, 0.78, 0.85]
fog_density = 0.003
fog_start = 25.0
fog_height_enabled = true
fog_height_falloff = 0.01
fog_height_origin = 5.0


