# ============================================================
#  TRACK — spline path + swept cross-section meshes
# ============================================================

# Pure path data — no geometry
[entities.track_path]
[entities.track_path.spline]
file = "splines/mountain_switchback.spline.toml"
[entities.track_path.track_info]
length = 886.0
name = "Mountain Switchback"
fog_density = 0.0022   # chase_camera drives the live fog from this

# Road surface — narrower than Oval Plus (10m vs 12m), darker asphalt.
# texture_length matches the width so curbs and dashes keep their shape
[entities.track_road]
[entities.track_road.spline_mesh]
spline = "track_path"
chunk_size = 30
width = 10.0
height = 0.3
offset = [0.0, -0.15]
color = [0.88, 0.88, 0.9, 1.0]
texture = "textures/road_asphalt.png"
normal_texture = "textures/road_asphalt_normal.png"
texture_length = 10.0
roughness = 0.85
friction = 0.8
restitution = 0.1

