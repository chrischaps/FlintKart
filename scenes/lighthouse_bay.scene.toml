# ================================================================
#  FLINT KART — Lighthouse Bay
# ================================================================
#
#  A coastal loop at the end of a summer afternoon: the promenade
#  straight, a climb past the lighthouse and through the headland,
#  a fast run down the cliffs and a causeway over the lagoon.
#
#  Launch: play_bay.bat
#  Dressing: tracks/lighthouse_bay.dress.toml (tools/dress_track.py)
# ================================================================

[scene]
name = "Flint Kart — Lighthouse Bay"
version = "1.0"
description = "Coastal circuit: promenade, headland tunnel, cliff descent and lagoon causeway"
input_config = "config/input.toml"

[environment]
skybox = "textures/skybox_kart.png"

[post_process]
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 0.9
vignette_enabled = true
vignette_intensity = 0.35
vignette_smoothness = 0.9
exposure = 1.1
ssao_enabled = true
ssao_radius = 0.8
ssao_intensity = 0.7
# Sea air: a bright, faintly warm haze over the water
fog_enabled = true
fog_color = [0.70, 0.80, 0.90]
fog_density = 0.0014
fog_start = 60.0
fog_height_enabled = true
fog_height_falloff = 0.03
fog_height_origin = 0.0

# Sky — a high, clean blue going gold toward the sun over the sea
[entities.sky]
[entities.sky.sky]
zenith_color = [0.05, 0.24, 0.70, 1.0]
horizon_color = [0.62, 0.74, 0.92, 1.0]
haze_color = [1.0, 0.88, 0.70, 0.45]
cloud_tint = [1.0, 0.95, 0.88, 0.85]
cloud_coverage = 0.28
cloud_density = 0.3
cloud_scale = 0.7
sun_disc_size = 0.035
sun_glow = 1.3

# The sea: cel-banded swell around the whole island, foam where it meets
# the beaches, the causeway columns and the sea stacks
[entities.sea]
[entities.sea.transform]
position = [0, 0, 0]
[entities.sea.ocean]
seed = 11
amplitude = 0.45
wavelength_min = 2.0
wavelength_max = 26.0
choppiness = 0.55
direction_deg = 250.0
wind_speed = 6.0
fetch_km = 20.0
deep_color = [0.02, 0.22, 0.42, 1.0]
shallow_color = [0.08, 0.58, 0.72, 1.0]
sss_color = [0.10, 0.85, 0.75, 1.0]
ramp_steps = 3.0
specular_strength = 1.2
turbidity = 0.5
shore_foam_width = 0.8
shore_foam_strength = 0.9
shore_foam_reach = 2.0
sky_reflection_strength = 0.6


