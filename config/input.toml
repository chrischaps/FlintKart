version = 1
game_id = "flint_kart"

# --- Steering: analog axis for smooth gamepad control ---
# Keyboard keys produce -1.0 / +1.0, gamepad stick gives graduated values.
[actions.steering]
kind = "axis1d"
[[actions.steering.bindings]]
type = "key"
code = "KeyA"
scale = -1.0
[[actions.steering.bindings]]
type = "key"
code = "ArrowLeft"
scale = -1.0
[[actions.steering.bindings]]
type = "key"
code = "KeyD"
[[actions.steering.bindings]]
type = "key"
code = "ArrowRight"
[[actions.steering.bindings]]
type = "gamepad_axis"
axis = "LeftStickX"
gamepad = "any"
deadzone = 0.15
scale = 1.0

# --- Accelerate: RT trigger + A button + keyboard ---
# Both button and axis bindings for triggers: Windows Xbox drivers report
# triggers as buttons (RightTrigger2), other platforms may report as analog
# axes (RightZ). Including both ensures cross-platform compatibility.
[actions.accelerate]
kind = "axis1d"
[[actions.accelerate.bindings]]
type = "key"
code = "KeyW"
[[actions.accelerate.bindings]]
type = "key"
code = "ArrowUp"
[[actions.accelerate.bindings]]
type = "gamepad_button"
button = "South"
gamepad = "any"
[[actions.accelerate.bindings]]
type = "gamepad_button"
button = "RightTrigger2"
gamepad = "any"
[[actions.accelerate.bindings]]
type = "gamepad_axis"
axis = "RightZ"
gamepad = "any"
deadzone = 0.05
scale = 1.0

# --- Brake: LT trigger + B button + keyboard ---
[actions.brake]
kind = "axis1d"
[[actions.brake.bindings]]
type = "key"
code = "KeyS"
[[actions.brake.bindings]]
type = "key"
code = "ArrowDown"
[[actions.brake.bindings]]
type = "gamepad_button"
button = "East"
gamepad = "any"
[[actions.brake.bindings]]
type = "gamepad_button"
button = "LeftTrigger2"
gamepad = "any"
[[actions.brake.bindings]]
type = "gamepad_axis"
axis = "LeftZ"
gamepad = "any"
deadzone = 0.05
scale = 1.0

# --- Look back (rear-view camera) ---
[actions.look_back]
kind = "button"
[[actions.look_back.bindings]]
type = "key"
code = "KeyC"
[[actions.look_back.bindings]]
type = "gamepad_button"
button = "RightTrigger"
gamepad = "any"

# --- Drift (hold to initiate drift while steering) ---
[actions.drift]
kind = "button"
[[actions.drift.bindings]]
type = "key"
code = "ShiftLeft"
[[actions.drift.bindings]]
type = "gamepad_button"
button = "LeftTrigger"
gamepad = "any"

# --- Use Item ---
[actions.use_item]
kind = "button"
[[actions.use_item.bindings]]
type = "key"
code = "KeyE"
[[actions.use_item.bindings]]
type = "gamepad_button"
button = "West"
gamepad = "any"

# --- Restart ---
[actions.restart]
kind = "button"
[[actions.restart.bindings]]
type = "key"
code = "KeyR"
[[actions.restart.bindings]]
type = "gamepad_button"
button = "North"
gamepad = "any"

# --- Pause ---
[actions.pause]
kind = "button"
[[actions.pause.bindings]]
type = "key"
code = "Escape"
[[actions.pause.bindings]]
type = "gamepad_button"
button = "Start"
gamepad = "any"

# --- Menu Confirm ---
[actions.menu_confirm]
kind = "button"
[[actions.menu_confirm.bindings]]
type = "key"
code = "Enter"
[[actions.menu_confirm.bindings]]
type = "key"
code = "Space"
[[actions.menu_confirm.bindings]]
type = "gamepad_button"
button = "South"
gamepad = "any"

# --- Menu Back ---
[actions.menu_back]
kind = "button"
[[actions.menu_back.bindings]]
type = "key"
code = "Backspace"
[[actions.menu_back.bindings]]
type = "gamepad_button"
button = "East"
gamepad = "any"

# --- Menu Up ---
[actions.menu_up]
kind = "button"
[[actions.menu_up.bindings]]
type = "key"
code = "KeyW"
[[actions.menu_up.bindings]]
type = "key"
code = "ArrowUp"
[[actions.menu_up.bindings]]
type = "gamepad_button"
button = "DPadUp"
gamepad = "any"

# --- Menu Down ---
[actions.menu_down]
kind = "button"
[[actions.menu_down.bindings]]
type = "key"
code = "KeyS"
[[actions.menu_down.bindings]]
type = "key"
code = "ArrowDown"
[[actions.menu_down.bindings]]
type = "gamepad_button"
button = "DPadDown"
gamepad = "any"

# --- On a phone (Flint#133, #134): the engine's on-screen controls ---
# The left thumb drives: a floating stick that lands under the thumb, with
# left/right steering, pushed up for gas and down to brake or reverse (as
# the old script joystick did). The right thumb holds DRIFT and taps ITEM.
# The HUD keeps its own pause button, and puts these away under the pause
# and finish menus (set_touch_controls) so the rows can be tapped.
[touch_controls]
opacity = 0.85

[[touch_controls.sticks]]
anchor = "bottom_left"
offset = [120, 110]
radius = 60
deadzone = 0.12
x = "steering"
up = "accelerate"
down = "brake"
region = [0.0, 0.3, 0.5, 0.7]

# Both sit above the HUD's speed readout in the bottom-right corner; on a
# short screen the HUD's standings board gives way to them (hud.rhai).
[[touch_controls.buttons]]
action = "drift"
anchor = "bottom_right"
offset = [92, 140]
radius = 46

[[touch_controls.buttons]]
action = "use_item"
label = "item"
anchor = "bottom_right"
offset = [196, 108]
radius = 32
