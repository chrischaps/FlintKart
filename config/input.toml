version = 1
game_id = "flint_kart"

# --- Steering: analog axis for smooth gamepad control ---
# Keyboard keys produce -1.0 / +1.0, gamepad stick gives graduated values.
[actions.steering]
kind = "axis1d"
[[actions.steering.bindings]]
type = "key"
code = "KeyA"
scale = -1.0
[[actions.steering.bindings]]
type = "key"
code = "ArrowLeft"
scale = -1.0
[[actions.steering.bindings]]
type = "key"
code = "KeyD"
[[actions.steering.bindings]]
type = "key"
code = "ArrowRight"
[[actions.steering.bindings]]
type = "gamepad_axis"
axis = "LeftStickX"
gamepad = "any"
deadzone = 0.15
scale = 1.0

# --- Accelerate: RT trigger + A button + keyboard ---
# Both button and axis bindings for triggers: Windows Xbox drivers report
# triggers as buttons (RightTrigger2), other platforms may report as analog
# axes (RightZ). Including both ensures cross-platform compatibility.
[actions.accelerate]
kind = "axis1d"
[[actions.accelerate.bindings]]
type = "key"
code = "KeyW"
[[actions.accelerate.bindings]]
type = "key"
code = "ArrowUp"
[[actions.accelerate.bindings]]
type = "gamepad_button"
button = "South"
gamepad = "any"
[[actions.accelerate.bindings]]
type = "gamepad_button"
button = "RightTrigger2"
gamepad = "any"
[[actions.accelerate.bindings]]
type = "gamepad_axis"
axis = "RightZ"
gamepad = "any"
deadzone = 0.05
scale = 1.0

# --- Brake: LT trigger + B button + keyboard ---
[actions.brake]
kind = "axis1d"
[[actions.brake.bindings]]
type = "key"
code = "KeyS"
[[actions.brake.bindings]]
type = "key"
code = "ArrowDown"
[[actions.brake.bindings]]
type = "gamepad_button"
button = "East"
gamepad = "any"
[[actions.brake.bindings]]
type = "gamepad_button"
button = "LeftTrigger2"
gamepad = "any"
[[actions.brake.bindings]]
type = "gamepad_axis"
axis = "LeftZ"
gamepad = "any"
deadzone = 0.05
scale = 1.0

# --- Look back (rear-view camera) ---
[actions.look_back]
kind = "button"
[[actions.look_back.bindings]]
type = "key"
code = "KeyC"
[[actions.look_back.bindings]]
type = "gamepad_button"
button = "RightTrigger"
gamepad = "any"

# --- Drift (hold to initiate drift while steering) ---
[actions.drift]
kind = "button"
[[actions.drift.bindings]]
type = "key"
code = "ShiftLeft"
[[actions.drift.bindings]]
type = "gamepad_button"
button = "LeftTrigger"
gamepad = "any"

# --- Restart ---
[actions.restart]
kind = "button"
[[actions.restart.bindings]]
type = "key"
code = "KeyR"
[[actions.restart.bindings]]
type = "gamepad_button"
button = "North"
gamepad = "any"

# --- Pause ---
[actions.pause]
kind = "button"
[[actions.pause.bindings]]
type = "key"
code = "Escape"
[[actions.pause.bindings]]
type = "gamepad_button"
button = "Start"
gamepad = "any"

# --- Menu Confirm ---
[actions.menu_confirm]
kind = "button"
[[actions.menu_confirm.bindings]]
type = "key"
code = "Enter"
[[actions.menu_confirm.bindings]]
type = "key"
code = "Space"
[[actions.menu_confirm.bindings]]
type = "gamepad_button"
button = "South"
gamepad = "any"

# --- Menu Back ---
[actions.menu_back]
kind = "button"
[[actions.menu_back.bindings]]
type = "key"
code = "Backspace"
[[actions.menu_back.bindings]]
type = "gamepad_button"
button = "East"
gamepad = "any"

# --- Menu Up ---
[actions.menu_up]
kind = "button"
[[actions.menu_up.bindings]]
type = "key"
code = "KeyW"
[[actions.menu_up.bindings]]
type = "key"
code = "ArrowUp"
[[actions.menu_up.bindings]]
type = "gamepad_button"
button = "DPadUp"
gamepad = "any"

# --- Menu Down ---
[actions.menu_down]
kind = "button"
[[actions.menu_down.bindings]]
type = "key"
code = "KeyS"
[[actions.menu_down.bindings]]
type = "key"
code = "ArrowDown"
[[actions.menu_down.bindings]]
type = "gamepad_button"
button = "DPadDown"
gamepad = "any"
