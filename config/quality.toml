# Graphics tiers (#57): what the Graphics setting in the menu and the pause
# card picks between. scripts/lib/quality.rhai reads this table, hands the
# `[tiers.<name>.engine]` keys to the engine's set_quality() (#55, engine book
# concepts/quality-settings.md) and keeps the rest for the game's scripts.
# tools/device_profile.py and tools/quality_snapshots.py read it too, so a
# number changed here changes what the phone is measured with.
#
# The numbers come from the Pixel 8 Pro spike (#54,
# docs/spikes/pixel-8-pro-load-levers.md, "Proposed tiers"). The spike's four
# tiers fold into three: High is its Ultra (the full look the game was tuned
# at), Medium and Low are its Medium and Low.
#
#   SSAO is the heaviest GPU pass on every track; shadows are next, and their
#   cost is in the cascades, not the map size; render scale 0.75 saved 3-12 ms
#   of GPU on the phone; bloom 4-10 ms when hot. MSAA 4x cost nothing on the
#   Mali, so every tier keeps it, and a tier change never rebuilds pipelines.
#
# Post keys are caps (a tier can turn an effect off or lower it, never add one
# a scene's look didn't ask for).
#
# Game keys, outside `engine`:
#   fx_density        scale on every particle emitter's rate and burst count
#                     (kart_fx.rhai); 1 is the authored amount
#   lod_scale         set_lod_scale(): under 1 swaps in the simpler levels of
#                     the set dressing sooner (#56; skipped where the engine
#                     doesn't have it yet)
#   draw_distance     set_draw_distance_scale(): scales every draw distance
#
# A player's choice is saved as `graphics_tier`: "auto" or a tier. With none
# saved the game runs on Auto (#58), below. A saved "engine" is a profiling
# hook: the scripts then leave the settings --quality or dev_profile.toml
# launched with (tools/device_profile.py), and Auto is off.

order = ["low", "medium", "high"]

# ── Auto (#58) ──
# Most players never open a settings menu, so Auto is where the game starts.
# It picks a first tier from gpu_info() (class, then platform), and
# scripts/quality_governor.rhai moves it while racing: it judges 2 s windows
# by their median frame time, steps a tier down after `over_windows` windows
# over budget (the target frame time and a fifth), and queues a step up after
# `first_calm` seconds of calm (at or under the target and `calm_margin`).
# A queued step up waits for the pause card or the next grid, never a race in
# motion. A step up that is over budget within two windows is taken back at
# once and the next calm wait doubles, up to `max_calm`, so a device on the
# edge (a phone getting hot) settles instead of flapping.
#
# Tables keyed by gpu_info().class: "desktop", "integrated", "mobile",
# "unknown" (a browser that won't say), "software"; `other` is the rest.
# `start_platform` (keyed by gpu_info().platform: "web", "android", ...)
# overrides the class's start; a page often can't see its GPU.
#
# The tier Auto runs at is saved as `auto_tier`; picking a tier by hand turns
# the governor off and leaves `auto_tier` for when Auto comes back.

[auto]
label = "AUTO"
blurb = "Finds the smoothest look this device holds"
window = 2.0
over = 1.2
calm_margin = 1.05
over_windows = 2
first_calm = 20.0
max_calm = 160.0
settle = 1.0
stall = 0.25

[auto.fps]
mobile = 30
unknown = 30
software = 30
other = 60

[auto.start]
desktop = "high"
integrated = "medium"
mobile = "medium"
unknown = "medium"
software = "low"
other = "medium"

[auto.start_platform]
web = "medium"

[auto.floor]
other = "low"

[auto.ceiling]
mobile = "medium"
other = "high"

[tiers.low]
label = "LOW"
blurb = "Smoothest. For phones when hot and older laptops"
fx_density = 0.5
lod_scale = 0.5
draw_distance = 0.6

[tiers.low.engine]
render_scale = 0.6
msaa = 4
shadows = true
shadow_resolution = 2048
shadow_cascades = 1
shadow_distance = 60.0
post_process = true
bloom = false
ssao = false
ssao_samples = 16
fog = true
volumetric = false

[tiers.medium]
label = "MEDIUM"
blurb = "Balanced. Where a phone starts"
fx_density = 0.75
lod_scale = 0.75
draw_distance = 1.0

[tiers.medium.engine]
render_scale = 0.75
msaa = 4
shadows = true
shadow_resolution = 2048
shadow_cascades = 2
shadow_distance = 120.0
post_process = true
bloom = true
ssao = true
ssao_samples = 16
fog = true
volumetric = true

[tiers.high]
label = "HIGH"
blurb = "The full look"
fx_density = 1.0
lod_scale = 1.0
draw_distance = 1.0

[tiers.high.engine]
render_scale = 1.0
msaa = 4
shadows = true
shadow_resolution = 2048
shadow_cascades = 3
shadow_distance = 200.0
post_process = true
bloom = true
ssao = true
ssao_samples = 64
fog = true
volumetric = true
