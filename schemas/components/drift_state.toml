[component.drift_state]
description = "Drift state machine (written by kart_controller.rhai, read by visuals/audio/HUD)"

[component.drift_state.fields.state]
type = "string"
default = "none"

[component.drift_state.fields.drift_angle]
type = "f32"
default = 0.0

[component.drift_state.fields.drift_direction]
type = "f32"
default = 0.0

[component.drift_state.fields.drift_timer]
type = "f32"
default = 0.0

[component.drift_state.fields.boost_tier]
type = "i32"
default = 0

[component.drift_state.fields.boost_time_remaining]
type = "f32"
default = 0.0

[component.drift_state.fields.boost_speed_bonus]
type = "f32"
default = 0.0

[component.drift_state.fields.hop_timer]
type = "f32"
default = 0.0

[component.drift_state.fields.tier]
type = "i32"
default = 0
description = "Current drift charge tier (0-3) while hopping or drifting; 0 otherwise"

[component.drift_state.fields.charge]
type = "f32"
default = 0.0
description = "Drift charge in seconds; faster when steering into the drift"
