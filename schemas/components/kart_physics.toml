[component.kart_physics]
description = "Kart vehicle physics tuning parameters"

[component.kart_physics.fields.max_speed]
type = "float"
default = 30.0

[component.kart_physics.fields.acceleration]
type = "float"
default = 15.0

[component.kart_physics.fields.brake_decel]
type = "float"
default = 25.0

[component.kart_physics.fields.drag]
type = "float"
default = 0.5

[component.kart_physics.fields.turn_rate_low]
type = "float"
default = 180.0
description = "Turn rate in degrees/sec at low speed"

[component.kart_physics.fields.turn_rate_high]
type = "float"
default = 60.0
description = "Turn rate in degrees/sec at max speed"

[component.kart_physics.fields.gravity]
type = "float"
default = -20.0

[component.kart_physics.fields.ground_ray_length]
type = "float"
default = 2.0

# ── Feel pass (#6) ── every constant the controller tunes lives here, so a
# retune is a prefab or scene override, never a script edit.

# Steering
[component.kart_physics.fields.steer_response]
type = "float"
default = 7.0
description = "How fast the front wheels follow the stick, in full locks per second"

[component.kart_physics.fields.steer_curve]
type = "float"
default = 1.35
description = "Exponent on analog steering input (player only); above 1 softens the centre"

[component.kart_physics.fields.min_turn_radius]
type = "float"
default = 2.6
description = "Tightest circle the kart can drive in metres; caps turn rate at crawling speed"

# Grip: how fast sideways slip is scrubbed away (per second)
[component.kart_physics.fields.grip]
type = "float"
default = 9.0

[component.kart_physics.fields.drift_grip]
type = "float"
default = 3.5

[component.kart_physics.fields.offroad_grip]
type = "float"
default = 4.0

[component.kart_physics.fields.offroad_speed_factor]
type = "float"
default = 0.6
description = "Top speed off the road, as a fraction of max_speed"

[component.kart_physics.fields.overspeed_decay]
type = "float"
default = 2.5
description = "How fast speed above the current cap (after a boost, onto grass) eases back, per second"

# Drift: charge seconds to reach each tier (steering into the drift charges
# faster, counter-steering slower), and what each tier pays out on release
[component.kart_physics.fields.drift_tier1]
type = "float"
default = 0.75

[component.kart_physics.fields.drift_tier2]
type = "float"
default = 1.6

[component.kart_physics.fields.drift_tier3]
type = "float"
default = 2.8

[component.kart_physics.fields.boost_speed_1]
type = "float"
default = 5.0

[component.kart_physics.fields.boost_speed_2]
type = "float"
default = 8.0

[component.kart_physics.fields.boost_speed_3]
type = "float"
default = 11.0

[component.kart_physics.fields.boost_time_1]
type = "float"
default = 0.5

[component.kart_physics.fields.boost_time_2]
type = "float"
default = 0.85

[component.kart_physics.fields.boost_time_3]
type = "float"
default = 1.25

[component.kart_physics.fields.boost_kick]
type = "float"
default = 0.4
description = "Fraction of a drift boost's speed bonus added the instant the drift is released"

[component.kart_physics.fields.hop_speed]
type = "float"
default = 4.5
description = "Upward speed of the drift-entry hop, m/s"

# Collisions
[component.kart_physics.fields.mass]
type = "float"
default = 1.0
description = "Relative mass in kart-to-kart bumps (1.0 = everyone equal)"

[component.kart_physics.fields.bump_restitution]
type = "float"
default = 0.55

[component.kart_physics.fields.bump_min_separation]
type = "float"
default = 2.0
description = "Karts in contact always part at least this fast (m/s), so they never lock together"

[component.kart_physics.fields.wall_restitution]
type = "float"
default = 0.25

[component.kart_physics.fields.wall_friction]
type = "float"
default = 0.3
description = "Speed scrubbed along a wall per unit of impact"

[component.kart_physics.fields.wall_align]
type = "float"
default = 5.0
description = "How fast a kart scraping a wall turns to run along it, per second"

# Suspension (visual body attitude; never feeds back into the physics)
[component.kart_physics.fields.roll_per_g]
type = "float"
default = 0.25
description = "Body roll in degrees per m/s^2 of cornering"

[component.kart_physics.fields.pitch_per_g]
type = "float"
default = 0.3
description = "Body pitch in degrees per m/s^2 of braking or acceleration"

[component.kart_physics.fields.max_roll]
type = "float"
default = 6.0

[component.kart_physics.fields.max_pitch]
type = "float"
default = 6.0

[component.kart_physics.fields.spring]
type = "float"
default = 140.0
description = "Suspension stiffness; with damper sets how bouncy the body is"

[component.kart_physics.fields.damper]
type = "float"
default = 13.0

[component.kart_physics.fields.draft_speed]
type = "float"
default = 3.0
description = "Top speed added at full slipstream (3-15 m behind another kart), m/s; 0 turns drafting off"
