[component.kart_state]
description = "Kart runtime state (written each frame by kart_controller.rhai)"

[component.kart_state.fields.speed]
type = "float"
default = 0.0

[component.kart_state.fields.velocity_x]
type = "float"
default = 0.0

[component.kart_state.fields.velocity_y]
type = "float"
default = 0.0

[component.kart_state.fields.velocity_z]
type = "float"
default = 0.0

[component.kart_state.fields.forward_x]
type = "float"
default = 0.0

[component.kart_state.fields.forward_y]
type = "float"
default = 0.0

[component.kart_state.fields.forward_z]
type = "float"
default = -1.0

[component.kart_state.fields.grounded]
type = "bool"
default = false

[component.kart_state.fields.surface_normal_x]
type = "float"
default = 0.0

[component.kart_state.fields.surface_normal_y]
type = "float"
default = 1.0

[component.kart_state.fields.surface_normal_z]
type = "float"
default = 0.0

[component.kart_state.fields.yaw]
type = "float"
default = 0.0

[component.kart_state.fields.input_enabled]
type = "bool"
default = false

[component.kart_state.fields.wall_impact]
type = "float"
default = 0.0

[component.kart_state.fields.respawned]
type = "bool"
default = false

[component.kart_state.fields.lateral_speed]
type = "float"
default = 0.0
description = "Sideways slip along the travel direction's right vector, m/s"

[component.kart_state.fields.surface]
type = "string"
default = "road"
description = "\"road\", \"curb\", \"offroad\" or \"air\""

[component.kart_state.fields.wall_contact]
type = "bool"
default = false
description = "True while scraping a wall"

[component.kart_state.fields.draft]
type = "float"
default = 0.0
description = "Slipstream 0-1: tucked in behind another kart, for a little more top speed"
