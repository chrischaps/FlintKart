[component.kart_visual_state]
description = "Bridge between kart_controller and kart_visuals for visual feedback"

[component.kart_visual_state.fields.steering]
type = "float"
default = 0.0

[component.kart_visual_state.fields.braking]
type = "bool"
default = false

[component.kart_visual_state.fields.reversing]
type = "bool"
default = false

[component.kart_visual_state.fields.wheel_spin]
type = "float"
default = 0.0

[component.kart_visual_state.fields.throttle]
type = "float"
default = 0.0

[component.kart_visual_state.fields.roll]
type = "float"
default = 0.0
description = "Body roll in degrees; positive dips the right side"

[component.kart_visual_state.fields.pitch]
type = "float"
default = 0.0
description = "Body pitch in degrees; positive lifts the nose"

[component.kart_visual_state.fields.squash]
type = "float"
default = 0.0
description = "Suspension compression 0-1"
