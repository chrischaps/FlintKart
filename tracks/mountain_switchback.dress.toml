# Mountain Switchback — alpine golden hour. The road climbs a real mountain
# now: pine forest on the flanks, snow on the trees and peaks up high, rock
# where it's steep, a snow shed over the descent and chalets with lit
# windows. A ring of tall peaks closes the valley.
#
#   python tools/dress_track.py tracks/mountain_switchback.dress.toml
#
# 24 control points: CP k is at t = k/24. The summit hairpins are CP 8-11
# (t 0.33-0.46).

scene = "scenes/mountain_switchback.scene.toml"
seed = 23
corridor = 10.0     # road half-width 5 + verge 4 + 1
chunk = 160.0
roads = [{ spline = "splines/mountain_switchback.spline.toml", half_width = 5.0 }]

[terrain]
mode = "alpine"
margin = 320.0
spacing = 3.0
base = -0.8
lift = 1.0          # the land is as high as the road around it: a mountain
lift_sigma = 22.0
hills = 8.0
hill_scale = 90.0
ring = 160.0
ring_start = 120.0
# the shoulder the summit hairpins hang on, and a peak behind the valley
massif = [
    { center = [60.0, -150.0], height = 22.0, radius = 80.0 },
    { center = [-120.0, -190.0], height = 80.0, radius = 110.0 },
]
ring_scale = 70.0
blend = 40.0
bridge_cut = 12.0   # open ground under the flyover at the start
rock_slope = 0.7
snow_line = 58.0
texture_size = 2048
[terrain.colors]
grass = [0.38, 0.58, 0.27]
grass_dark = [0.24, 0.44, 0.23]
rock = [0.55, 0.53, 0.57]
snow = [0.95, 0.96, 1.00]

[[entity]]
asset = "prop_gantry"
name = "dress_gantry"
t = 0.0
side = 0
sink = 0.0

[[entity]]
