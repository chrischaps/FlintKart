# The Crossroads — Branching track with a shortcut
#
# A flowing closed circuit with one branching shortcut path.
# The shortcut is shorter but elevated — requires a jump to enter.
#
# Layout (top-down, Z goes up on screen):
#
#                          ┌── Shortcut (elevated) ──┐
#                          │                          │
#    START ─── curve ─── FORK ─── long way ─── MERGE ─── back to START
#      (0,0,0)
#
# ~400m canonical path, ~200m shortcut

[track]
name = "The Crossroads"
closed = true

[sampling]
spacing = 1.5

[road]
width = 12.0
height = 0.3
offset = [0.0, -0.15]
color = [1.0, 1.0, 1.0, 1.0]
# Textures from tools/generate_road_textures.py; without `texture` the road
# falls back to stripe_color / stripe_width vertex stripes
texture = "textures/road_asphalt.png"
normal_texture = "textures/road_asphalt_normal.png"
texture_length = 12.0
roughness = 0.85
fill_texture = "textures/road_asphalt_plain.png"   # junction fills
fill_texture_length = 6.0
chunk_size = 30
friction = 0.8
restitution = 0.1

[walls]
width = 0.5
height = 1.5
left_color = [1.0, 1.0, 1.0, 1.0]
right_color = [1.0, 1.0, 1.0, 1.0]
left_texture = "textures/road_barrier_tomato.png"
right_texture = "textures/road_barrier_sky.png"
texture_length = 4.0
roughness = 0.7
friction = 0.3
restitution = 0.5

# Grass shoulders beyond each barrier
[verges]
width = 4.0
color = [1.0, 1.0, 1.0, 1.0]
texture = "textures/road_grass.png"
normal_texture = "textures/road_grass_normal.png"
texture_length = 4.0
roughness = 0.95

[environment]
skybox = "textures/skybox_kart.png"

# Harvest dusk: a low tomato sun ahead of the start line, violet overhead,
# lamps coming on (tracks/the_crossroads.dress.toml places them)
[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 0.9
vignette_enabled = true
vignette_intensity = 0.4
vignette_smoothness = 0.9
exposure = 1.15
ssao_enabled = true
ssao_radius = 0.8
ssao_intensity = 0.7
fog_enabled = true
fog_color = [0.66, 0.48, 0.52]
fog_density = 0.0024
fog_start = 40.0
fog_height_enabled = true
fog_height_falloff = 0.025
fog_height_origin = 0.0

[sky]
zenith_color = [0.08, 0.06, 0.26, 1.0]
horizon_color = [0.98, 0.46, 0.30, 1.0]
haze_color = [1.0, 0.62, 0.38, 0.65]
cloud_tint = [0.96, 0.52, 0.50, 0.75]
cloud_coverage = 0.3
cloud_density = 0.3
cloud_scale = 0.75
sun_disc_size = 0.05
sun_glow = 1.8
star_opacity = 0.35
ambient_sky = [0.30, 0.25, 0.42, 1.0]
ambient_ground = [0.20, 0.13, 0.10, 1.0]

[sun]
direction = [-0.55, 0.17, -0.82]
color = [1.0, 0.56, 0.34]
intensity = 1.5

# ─── Control Points ─────────────────────────────────────
# Start/finish straight (heading -Z)
[[control_points]]
position = [0, 0, 0]

[[control_points]]
position = [0, 0, -40]

# Right-hand sweep into fork zone
[[control_points]]
position = [20, 0, -80]

# Fork junction — shortcut branches off here
[[control_points]]
position = [60, 0, -100]
fork = "shortcut"

# Canonical path: long sweeping route
[[control_points]]
position = [100, 0, -110]

[[control_points]]
position = [140, 0, -80]

[[control_points]]
position = [150, 0, -40]

# Merge junction — shortcut reconnects
[[control_points]]
position = [130, 0, 0]
merge = "shortcut"

# Return leg back to start
[[control_points]]
position = [100, 0, 20]

[[control_points]]
position = [50, 0, 20]

# ─── Branch: Shortcut ───────────────────────────────────
# Elevated direct path from fork to merge
[branches.shortcut]
entry_type = "positional"

[[branches.shortcut.control_points]]
position = [80, 3, -80]

[[branches.shortcut.control_points]]
position = [110, 4, -50]
