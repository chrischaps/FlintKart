# The Crossroads — Branching track with a shortcut
#
# A flowing closed circuit with one branching shortcut path.
# The shortcut is shorter but elevated — requires a jump to enter.
#
# Layout (top-down, Z goes up on screen):
#
#                          ┌── Shortcut (elevated) ──┐
#                          │                          │
#    START ─── curve ─── FORK ─── long way ─── MERGE ─── back to START
#      (0,0,0)
#
# ~400m canonical path, ~200m shortcut

[track]
name = "The Crossroads"
closed = true

[sampling]
spacing = 1.5

[road]
width = 12.0
height = 0.3
offset = [0.0, -0.15]
color = [1.0, 1.0, 1.0, 1.0]
# Textures from tools/generate_road_textures.py; without `texture` the road
# falls back to stripe_color / stripe_width vertex stripes
texture = "textures/road_asphalt.png"
normal_texture = "textures/road_asphalt_normal.png"
texture_length = 12.0
roughness = 0.85
fill_texture = "textures/road_asphalt_plain.png"   # junction fills
fill_texture_length = 6.0
chunk_size = 30
friction = 0.8
restitution = 0.1

[walls]
width = 0.5
height = 1.5
left_color = [1.0, 1.0, 1.0, 1.0]
right_color = [1.0, 1.0, 1.0, 1.0]
left_texture = "textures/road_barrier_tomato.png"
right_texture = "textures/road_barrier_sky.png"
texture_length = 4.0
roughness = 0.7
friction = 0.3
restitution = 0.5

# Grass shoulders beyond each barrier
[verges]
width = 4.0
color = [1.0, 1.0, 1.0, 1.0]
texture = "textures/road_grass.png"
normal_texture = "textures/road_grass_normal.png"
texture_length = 4.0
roughness = 0.95

[environment]
skybox = "textures/skybox_kart.png"

[post_process]
bloom_enabled = true
bloom_intensity = 0.05
bloom_threshold = 0.9
vignette_enabled = true
vignette_intensity = 0.35
vignette_smoothness = 0.9
exposure = 1.1
ssao_enabled = true
ssao_radius = 0.8
ssao_intensity = 0.7
fog_enabled = true
fog_color = [0.68, 0.78, 0.90]
fog_density = 0.002
fog_start = 40.0
fog_height_enabled = true
fog_height_falloff = 0.015
fog_height_origin = 0.0

# ─── Control Points ─────────────────────────────────────
# Start/finish straight (heading -Z)
[[control_points]]
position = [0, 0, 0]

[[control_points]]
position = [0, 0, -40]

# Right-hand sweep into fork zone
[[control_points]]
position = [20, 0, -80]

# Fork junction — shortcut branches off here
[[control_points]]
position = [60, 0, -100]
fork = "shortcut"

# Canonical path: long sweeping route
[[control_points]]
position = [100, 0, -110]

[[control_points]]
position = [140, 0, -80]

[[control_points]]
position = [150, 0, -40]

# Merge junction — shortcut reconnects
[[control_points]]
position = [130, 0, 0]
merge = "shortcut"

# Return leg back to start
[[control_points]]
position = [100, 0, 20]

[[control_points]]
position = [50, 0, 20]

# ─── Branch: Shortcut ───────────────────────────────────
# Elevated direct path from fork to merge
[branches.shortcut]
entry_type = "positional"

[[branches.shortcut.control_points]]
position = [80, 3, -80]

[[branches.shortcut.control_points]]
position = [110, 4, -50]
