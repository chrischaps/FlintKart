# The Crossroads — harvest dusk. Farm country at the end of the day: a
# patchwork of wheat, stubble and plough with hedgerows between, autumn trees,
# hay bales, a red barn and a windmill, pumpkins by the verge, and lamps
# coming on along the road as the sky goes violet.
#
#   python tools/dress_track.py tracks/the_crossroads.dress.toml
#
# The canonical loop has 10 control points (CP k at t = k/10): the fork is
# at t 0.3, the merge at t 0.7. The shortcut spline is listed so the ground
# runs under it too.

scene = "scenes/the_crossroads.scene.toml"
seed = 31
corridor = 11.0
chunk = 180.0
roads = [
    { spline = "splines/the_crossroads/canonical.spline.toml", half_width = 6.0 },
    { spline = "splines/the_crossroads/seg_branch_shortcut.spline.toml", half_width = 6.0 },
]

[terrain]
mode = "farm"
margin = 300.0
spacing = 3.0
base = -0.6
lift = 0.8
lift_sigma = 30.0
hills = 5.0
hill_scale = 130.0
ring = 34.0
ring_start = 170.0
blend = 26.0
rock_slope = 1.6    # embankments stay grass; this is farmland
field_angle = 22.0
fields = ["wheat", "grass", "plough", "stubble", "grass_dark", "wheat"]
texture_size = 2048
[terrain.colors]
grass = [0.46, 0.60, 0.27]
grass_dark = [0.34, 0.50, 0.24]
rock = [0.58, 0.54, 0.52]
wheat = [0.92, 0.74, 0.34]
stubble = [0.80, 0.66, 0.40]
plough = [0.50, 0.35, 0.25]

