# Oval Plus — the Sunday Cup. A stadium circuit in a mown park: grandstands
# and a start gantry on the main straight, flags and sponsor boards, tyre
# stacks at the turns, round trees in clumps, a blimp over the infield and
# balloons on the horizon.
#
#   python tools/dress_track.py tracks/oval_plus.dress.toml
#
# t is the spline's parameter (0 = start line; 15 control points, so CP k is
# at k/15). side -1 is left of travel, +1 right, 0 across the road.

scene = "scenes/oval_plus.scene.toml"
seed = 11
corridor = 11.0     # road half-width 6 + verge 4 + 1
chunk = 200.0
roads = [{ spline = "splines/oval_plus.spline.toml", half_width = 6.0 }]

[terrain]
mode = "meadow"
margin = 300.0
spacing = 3.0
base = -0.6
lift = 0.6          # the hill section raises the park around it, a little
lift_sigma = 45.0
hills = 4.0
hill_scale = 110.0
ring = 38.0
ring_start = 170.0
blend = 28.0
lawn = 55.0         # mown stripes this far from the road
texture_size = 2048
[terrain.colors]
grass = [0.40, 0.64, 0.27]
grass_dark = [0.29, 0.53, 0.24]
lawn = [0.43, 0.70, 0.30]
rock = [0.60, 0.58, 0.58]

# ── Landmarks with their own textures ──
[[entity]]
