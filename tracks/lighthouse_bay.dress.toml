# Lighthouse Bay — a coastal loop at the end of a summer afternoon. Beach
# huts and umbrellas along the promenade, palms in the dunes, the lighthouse
# on the headland with a rock tunnel through it, sea stacks off the cliffs,
# and a causeway on columns across the lagoon. Water on both flanks.
#
#   python tools/dress_track.py tracks/lighthouse_bay.dress.toml
#
# 14 control points: CP k is at t = k/14. Headland top ~ t 0.29, tunnel
# t 0.31-0.35, cliff descent t 0.40-0.52, causeway t 0.56-0.70.

scene = "scenes/lighthouse_bay.scene.toml"
seed = 47
corridor = 11.0
chunk = 180.0
roads = [{ spline = "splines/lighthouse_bay.spline.toml", half_width = 6.0, bridges = [[0.57, 0.70]] }]

[terrain]
mode = "coast"
margin = 300.0
spacing = 3.0
base = 0.6
lift = 0.7
lift_sigma = 40.0
hills = 6.0
hill_scale = 100.0
ring = 26.0
ring_start = 200.0
blend = 30.0
rock_slope = 0.9
sea_level = 0.0
sea_floor = -7.0
# the open sea to the west of the promenade, and north-east past the cliffs
seas = [
    { dir = [-1.0, 0.0], shore = 30.0 },
    { dir = [0.8, -0.6], shore = 205.0 },
]
massif = [
    { center = [105.0, -175.0], height = 12.0, radius = 45.0 },   # the headland
    { center = [100.0, -205.0], height = 6.0, radius = 28.0 },    # the lighthouse point
    { center = [108.0, -18.0], height = -12.0, radius = 38.0 },   # the lagoon
]
texture_size = 2048
[terrain.colors]
grass = [0.48, 0.66, 0.30]
grass_dark = [0.36, 0.56, 0.28]
rock = [0.70, 0.60, 0.50]
sand = [0.96, 0.87, 0.64]
